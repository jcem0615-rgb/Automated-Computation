<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="LogicQuot">
  <defs>
    <linearGradient id="lq-tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#a9c9e2"/>
      <stop offset="0.38" stop-color="#6e9fc4"/>
      <stop offset="1"    stop-color="#2a6392"/>
    </linearGradient>
    <radialGradient id="lq-sheen" cx="0.36" cy="0.3" r="0.72">
      <stop offset="0"   stop-color="#eaf4fc" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a8c8de" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#1d4c74" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="lq-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#7fd8fb"/>
      <stop offset="0.5" stop-color="#3ba7e0"/>
      <stop offset="1"   stop-color="#1d6ea8"/>
    </linearGradient>
    <filter id="lq-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lq-clip">
      <rect x="10" y="10" width="236" height="236" rx="58"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#lq-tile)"/>
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#lq-sheen)"/>

  <g clip-path="url(#lq-clip)">
    <!-- Circuit traces out to the edges, with their nodes -->
    <g stroke="#2e8fc9" stroke-width="3.5" fill="none" opacity="0.95">
      <path d="M128 10V54M128 202v44M10 128h44M202 128h44"/>
      <path d="M60 60h34v34M196 60h-34v34M60 196h34v-34M196 196h-34v-34"/>
      <path d="M60 34v26H34M222 60h-26V34M34 196h26v26M196 222v-26h26"/>
    </g>
    <g fill="#6fd0f7">
      <rect x="88" y="88" width="12" height="12" rx="2.5"/>
      <rect x="156" y="88" width="12" height="12" rx="2.5"/>
      <rect x="88" y="156" width="12" height="12" rx="2.5"/>
      <rect x="156" y="156" width="12" height="12" rx="2.5"/>
      <rect x="122" y="26" width="12" height="12" rx="2.5"/>
      <rect x="122" y="218" width="12" height="12" rx="2.5"/>
      <rect x="26" y="122" width="12" height="12" rx="2.5"/>
      <rect x="218" y="122" width="12" height="12" rx="2.5"/>
    </g>

    <!-- Concentric rings: the "signal travelling round the board" motif -->
    <g fill="none" stroke="#8ddcfa" stroke-linecap="round">
      <circle cx="128" cy="128" r="96" stroke-width="2.4" opacity="0.42"
              stroke-dasharray="118 26 74 26" stroke-dashoffset="18"/>
      <circle cx="128" cy="128" r="76" stroke-width="2.4" opacity="0.55"
              stroke-dasharray="92 22 58 22"/>
      <circle cx="128" cy="128" r="56" stroke-width="2.2" opacity="0.38"
              stroke-dasharray="70 18 44 18" stroke-dashoffset="30"/>
    </g>

    <!-- Flow arrows riding the rings -->
    <g fill="#9fe3fb" opacity="0.9">
      <path d="M128 22l7 11h-14z" transform="rotate(28 128 128) translate(0 10)"/>
      <path d="M128 22l7 11h-14z" transform="rotate(150 128 128) translate(0 30)"/>
      <path d="M128 22l7 11h-14z" transform="rotate(255 128 128) translate(0 52)"/>
    </g>
  </g>

  <!-- The mark: an L whose upper arm drives a logic gate -->
  <g filter="url(#lq-glow)">
    <!-- L: the letterform and the conductor feeding the gate -->
    <path d="M97 76v100h62" fill="none" stroke="#5fd2fb" stroke-width="15"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Input lead, gate body, output lead and pad -->
    <path d="M97 122h22" fill="none" stroke="#5fd2fb" stroke-width="11"/>
    <path d="M119 96h13a26 26 0 0 1 0 52h-13z" fill="#5fd2fb"/>
    <path d="M158 122h18" fill="none" stroke="#5fd2fb" stroke-width="11"/>
    <circle cx="184" cy="122" r="8.5" fill="#5fd2fb"/>
  </g>

  <!-- Bezel -->
  <rect x="10" y="10" width="236" height="236" rx="58"
        fill="none" stroke="url(#lq-rim)" stroke-width="7"/>
  <rect x="19" y="19" width="218" height="218" rx="50"
        fill="none" stroke="#8fe0ff" stroke-width="2" opacity="0.5"/>
</svg>
